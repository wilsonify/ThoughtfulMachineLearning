[build-system]
requires = ["setuptools>=65.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tml"
version = "0.1.0"
description = "Thoughtful Machine Learning"
keywords = ["datascience", "python"]
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "bs4",
    "xgboost",
    "apache-airflow-providers-postgres",
    "apache-airflow",
]

[project.urls]
homepage = "https://github.com/wilsonify/thoughtfulmachinelearning"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["tml"]
